resources:
  # This is a Declarative Automation Bundle resource definition for the MT-007 Aviation Models job.
  # See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
  # Resource type: jobs
  jobs:
    mt_007_aviation_models:
      name: MT-007 - Aviation Models
      tasks:
        - task_key: SDP_Bronze_Silver
          disabled: false
          email_notifications: {}
          pipeline_task:
            pipeline_id: ${resources.pipelines.mt_005_aviation_sdp.id}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Notebook_Gold
          depends_on:
            - task_key: SDP_Bronze_Silver
          disable_auto_optimization: false
          disabled: false
          email_notifications: {}
          max_retries: 3
          min_retry_interval_millis: 300000
          notebook_task:
            notebook_path: ../src/MT-006 - Gold Layer.ipynb
            source: WORKSPACE
          retry_on_timeout: false
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Validate_Gold
          depends_on:
            - task_key: Notebook_Gold
          disabled: false
          email_notifications: {}
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: /Workspace/Users/yesyigitcan@gmail.com/Project - Aviation/tasks/MT-007/MT-007 - Gold Validation.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Alert_Cancelled_Ratio
          depends_on:
            - task_key: Notebook_Gold
          alert_task:
            alert_id: ${var.alert_id}
            warehouse_id: ${var.warehouse_id}
          disabled: false
          email_notifications: {}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: IF_Dummy
          depends_on:
            - task_key: Notebook_Gold
          condition_task:
            left: "1"
            op: EQUAL_TO
            right: "1"
          disabled: false
          email_notifications: {}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Iterate_Routes
          depends_on:
            - outcome: "true"
              task_key: IF_Dummy
          disabled: false
          email_notifications: {}
          for_each_task:
            inputs: '["ADB-AMS", "IST-AYT", "ESB-VIE"]'
            task:
              disabled: false
              email_notifications: {}
              notebook_task:
                base_parameters:
                  v_route: '{{input}}'
                notebook_path: /Workspace/Users/yesyigitcan@gmail.com/Project - Aviation/tasks/MT-007/MT-007 - Orchestration - Route Flight Count
                source: WORKSPACE
              run_if: ALL_SUCCESS
              task_key: Iterate_Routes_iteration
              timeout_seconds: 0
              webhook_notifications: {}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: clone_of_Iterate_Routes
          depends_on:
            - outcome: "false"
              task_key: IF_Dummy
          disabled: false
          email_notifications: {}
          for_each_task:
            inputs: '["IST-AYT", "ESB-VIE"]'
            task:
              disabled: false
              email_notifications: {}
              notebook_task:
                base_parameters:
                  v_route: '{{input}}'
                notebook_path: /Workspace/Users/yesyigitcan@gmail.com/Project - Aviation/tasks/MT-007/MT-007 - Orchestration - Route Flight Count
                source: WORKSPACE
              run_if: ALL_SUCCESS
              task_key: Iterate_Routes_iteration_2
              timeout_seconds: 0
              webhook_notifications: {}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      email_notifications:
        no_alert_for_skipped_runs: false
        on_failure:
          - ${var.notify_email}
        on_success:
          - ${var.notify_email}
      max_concurrent_runs: 1
      notification_settings:
        no_alert_for_canceled_runs: false
        no_alert_for_skipped_runs: false
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      schedule:
        pause_status: UNPAUSED
        quartz_cron_expression: 9 0 6 * * ?
        timezone_id: UTC
      timeout_seconds: 0
      webhook_notifications: {}
