# This is a Declarative Automation Bundle definition for dab_aviation.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_aviation
  uuid: e8f037c2-0789-455f-b95f-80181c624fdf

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
    default: aviation
  schema:
    description: The schema to use
    default: dev
  warehouse_id:
    description: The warehouse ID to use
    default: 14a67ca68f662cbe
  alert_id:
    description: The alert ID to use
    default: "1082604319579575"
  schedule_status:
    description: The schedule status to use
    default: UNPAUSED
  schedule_cron:
    description: The job schedule cron expression
    default: "9 0 6 * * ?"
  schedule_timezone:
    description: The job schedule timezone
    default: UTC
  performance_target:
    description: The performance target to use
    default: PERFORMANCE_OPTIMIZED
  pipeline_photon:
    description: Whether Photon is enabled for the pipeline
    default: true
  pipeline_serverless:
    description: Whether serverless compute is enabled for the pipeline
    default: true
  notify_email:
    description: The email to notify
    default: yesyigitcan@gmail.com

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-246f388c-4dac.cloud.databricks.com?w=1108327175483661
    variables:
      catalog: aviation
      schema: dev
      schedule_status: UNPAUSED
      schedule_cron: "9 0 6 * * ?"
      schedule_timezone: UTC
      performance_target: PERFORMANCE_OPTIMIZED
      pipeline_photon: true
      pipeline_serverless: true
  prod:
    mode: production
    workspace:
      host: https://dbc-246f388c-4dac.cloud.databricks.com?w=1108327175483661
      # We explicitly deploy to /Workspace/Users/yesyigitcan@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/yesyigitcan@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: aviation
      schema: prod
      schedule_status: UNPAUSED
      schedule_cron: "9 0 6 * * ?"
      schedule_timezone: UTC
      performance_target: PERFORMANCE_OPTIMIZED
      pipeline_photon: true
      pipeline_serverless: true
    permissions:
      - user_name: yesyigitcan@gmail.com
        level: CAN_MANAGE
